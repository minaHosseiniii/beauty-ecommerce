name: Backend CI

on:
  push:

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: mvn test
        working-directory: ./backend

      - run: mvn package
        working-directory: ./backend
