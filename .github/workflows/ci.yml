name: Backend CI

on:
  push:

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version
          ls -la
        working-directory: ./backend

      - name: Maven test
        run: mvn clean test -e
        working-directory: ./backend

      - run: mvn package
        working-directory: ./backend
